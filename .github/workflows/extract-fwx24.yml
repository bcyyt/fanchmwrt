name: Extract-Fwx-From-Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download S20P firmware from OpenWRT-CI release
        run: |
          URL="https://github.com/bcyyt/OpenWRT-CI/releases/download/MEDIATEK-WIFI-NO-VIKINGYFY-owrt-26.11.12-23.25.13/mediatek-filogic-supergateway_s20p-squashfs-sysupgrade-VIKINGYFY-owrt-WIFI-NO-26.11.12-23.25.13.bin"
          curl -sL --retry 3 -o fw.bin "$URL"
          ls -lh fw.bin

      - name: Unpack sysupgrade tar
        run: |
          tar tf fw.bin | head -20
          mkdir -p out && tar xf fw.bin -C out
          find out -name "root" -o -name "*.bin" | head -10
          ls -lh out/sysupgrade-supergateway_s20p/ 2>/dev/null || find out -maxdepth 3 -ls | head -20

      - name: Install squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools

      - name: Unsquash rootfs and collect fwx.ko
        run: |
          ROOTFS=$(find out -name root -type f | head -1)
          echo "rootfs blob: $ROOTFS"
          file "$ROOTFS"
          unsquashfs -d rootfs "$ROOTFS" 2>&1 | tail -3
          echo "=== fwx.ko ==="
          find rootfs/lib/modules -name "fwx.ko" -exec ls -lh {} \;
          KMOD=$(find rootfs/lib/modules -name "fwx.ko" | head -1)
          echo "=== vermagic ==="
          modinfo "$KMOD" | grep -E "vermagic|filename|depends"
          echo "=== fwxd ==="
          ls -lh rootfs/usr/bin/fwxd 2>/dev/null
          echo "=== libfwx ==="
          find rootfs/usr/lib -name "libfwx*" -exec ls -lh {} \;
          mkdir -p fwx24
          cp "$KMOD" fwx24/
          cp rootfs/usr/bin/fwxd fwx24/ 2>/dev/null || true
          find rootfs/usr/lib -name "libfwx*" -exec cp {} fwx24/ \; 2>/dev/null || true
          # 打包完整 vantage fwx 相关 UI（可选验证）
          tar czf fwx24/fw-pieces.tar.gz -C rootfs usr/bin/fwxd usr/lib/libfwx* lib/modules 2>/dev/null || tar czf fwx24/fw-pieces.tar.gz -C rootfs usr/bin/fwxd lib/modules
          ls -lh fwx24/

      - name: Upload fwx.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: fwx24
          path: fwx24/
          retention-days: 7
