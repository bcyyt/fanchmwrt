name: Build-S20P

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget jq

      - name: Cache toolchain and downloads
        uses: actions/cache@v4
        with:
          path: |
            dl/
            staging_dir/
            build_dir/
          key: s20p-toolchain-v1
          restore-keys: s20p-toolchain-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject S20P packages (iptv-auth + natfrp)
        run: |
          bash Scripts/inject-s20p-packages.sh

      - name: Seed config
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_supergateway_s20p=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_iptv-auth=y
          CONFIG_PACKAGE_luci-app-natfrp=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_luci-app-statusfw=y
          CONFIG_PACKAGE_luci-theme-vantage=y
          CONFIG_PACKAGE_luci-app-vantage=y
          EOF
          make defconfig -j1
          grep -c "supergateway_s20p" .config
          grep -E "CONFIG_PACKAGE_(iptv-auth|luci-app-natfrp|kmod-nft-offload|luci-app-statusfw|luci-theme-vantage|luci-app-vantage)=y" .config

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect images
        run: |
          mkdir -p release
          cp bin/targets/mediatek/filogic/*s20p* release/ || true
          cp bin/targets/mediatek/filogic/sha256sums release/ || true
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-s20p-images
          path: release/
          retention-days: 14
